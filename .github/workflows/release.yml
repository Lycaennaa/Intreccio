name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to package, such as v0.1.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      XCODE_DEVELOPER_DIR: ${{ vars.XCODE_DEVELOPER_DIR }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate tag and project version
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            printf 'Dispatch this workflow from the default branch (%s).\n' "$DEFAULT_BRANCH" >&2
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Expected a version tag like v0.1.0; got %s\n' "$RELEASE_TAG" >&2
            exit 1
          fi
          if ! git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            printf 'Tag does not exist: %s\n' "$RELEASE_TAG" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$RELEASE_TAG" "origin/$DEFAULT_BRANCH"; then
            printf 'Tag %s is not on the default branch history.\n' "$RELEASE_TAG" >&2
            exit 1
          fi
          git switch --detach "$RELEASE_TAG"
          version="$(python3 - <<'PY'
          import re
          from pathlib import Path

          text = Path("project.yml").read_text()
          match = re.search(r"(?m)^\s+MARKETING_VERSION:\s*[\"']?(\d+(?:\.\d+){1,2})", text)
          if match is None:
              raise SystemExit("MARKETING_VERSION is missing from project.yml")
          print(match.group(1))
          PY
          )"
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            printf 'Tag %s does not match project version %s.\n' "$RELEASE_TAG" "$version" >&2
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'Validated %s for project version %s.\n' "$RELEASE_TAG" "$version"

      - name: Select and report toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          if [ -n "${XCODE_DEVELOPER_DIR:-}" ]; then
            export DEVELOPER_DIR="$XCODE_DEVELOPER_DIR"
          fi
          xcode-select --print-path
          xcode_version="$(xcodebuild -version | /usr/bin/awk 'NR == 1 { print $2 }')"
          XCODE_VERSION="$xcode_version" python3 - <<'PY'
          import os
          import re

          version = tuple(int(part) for part in re.findall(r"\d+", os.environ["XCODE_VERSION"])[:2])
          if version < (26, 6):
              raise SystemExit(f"Xcode 26.6 or later required; found {os.environ['XCODE_VERSION']}")
          PY
          xcodebuild -version
          swift --version
          python3 --version

      - name: Generate Xcode project
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          fi
          xcodegen generate --spec project.yml

      - name: Validate repository tooling
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/check-package-locks.py
          python3 -B scripts/check-project-metadata.py

      - name: Install SwiftLint
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v swiftlint >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install swiftlint
          fi

      - name: Run mandatory SwiftLint
        shell: bash
        run: |
          set -euo pipefail
          swiftlint lint --config .swiftlint.yml --baseline .swiftlint-baseline.yml --strict

      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project Intreccio.xcodeproj \
            -scheme Intreccio \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/derived-data" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/source-packages" \
            -resultBundlePath "$RUNNER_TEMP/tests.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            SDKROOT=auto \
            test

      - name: Build and package release
        id: package
        shell: bash
        env:
          VERSION: ${{ steps.validate.outputs.version }}
        run: |
          set -euo pipefail
          xcodebuild \
            -project Intreccio.xcodeproj \
            -scheme Intreccio \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/derived-data" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/source-packages" \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            SDKROOT=auto \
            build
          bash scripts/package-app.sh \
            "$RUNNER_TEMP/derived-data/Build/Products/Release/Intreccio.app" \
            "$RUNNER_TEMP/release"
          asset="$RUNNER_TEMP/release/Intreccio-$VERSION-macos-arm64.zip"
          test -f "$asset"
          printf 'asset=%s\n' "$asset" >> "$GITHUB_OUTPUT"

      - name: Attest release asset
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: ${{ steps.package.outputs.asset }}

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" "${{ steps.package.outputs.asset }}" \
            --verify-tag \
            --generate-notes \
            --title "Intreccio $RELEASE_TAG"
