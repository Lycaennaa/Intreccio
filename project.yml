name: Intreccio

options:
  xcodeVersion: "26.6"
  deploymentTarget:
    macOS: "15.0"
  generateEmptyDirectories: false

configs:
  Debug: debug
  Release: release

settings:
  base:
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    SDKROOT: macosx
    SUPPORTED_PLATFORMS: macosx
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_VERSION: "6.0"

targets:
  Intreccio:
    type: application
    platform: macOS
    sources:
      - path: Intreccio
        excludes:
          - Assets.xcassets
          - GIthubDesktopCodex/**
          - Services/.DS_Store
          - '**/.DS_Store'
          - Resources/scc
      - path: Intreccio/Resources/scc
        type: file
        buildPhase: resources
    resources:
      - path: Intreccio/Assets.xcassets
      - path: Intreccio/Resources/scc-LICENSE.txt
      - path: Intreccio/Resources/scc-version.txt
    configFiles:
      Debug: Configuration/PublicIdentity.xcconfig
      Release: Configuration/PublicIdentity.xcconfig
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CURRENT_PROJECT_VERSION: 1
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_INCOMING_NETWORK_CONNECTIONS: NO
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: NO
        ENABLE_PREVIEWS: YES
        ENABLE_USER_SELECTED_FILES: readwrite
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: 0.1.0
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_IDENTIFIER)
        PRODUCT_NAME: $(APP_PRODUCT_NAME)
        REGISTER_APP_GROUPS: YES
        SUPPORTS_MACCATALYST: NO
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_EMIT_LOC_STRINGS: YES
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
  IntreccioTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: IntreccioTests
        excludes:
          - .test-tmp
    dependencies:
      - target: Intreccio
    configFiles:
      Debug: Configuration/PublicTestIdentity.xcconfig
      Release: Configuration/PublicTestIdentity.xcconfig
    settings:
      base:
        BUNDLE_LOADER: $(TEST_HOST)
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        EXCLUDED_SOURCE_FILE_NAMES:
          - .DS_Store
          - state.json
          - state.ui.json
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_TEST_BUNDLE_IDENTIFIER)
        PRODUCT_NAME: $(TARGET_NAME)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Intreccio.app/Contents/MacOS/Intreccio
  IntreccioIntegrationTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: IntreccioIntegrationTests
    dependencies:
      - target: Intreccio
    configFiles:
      Debug: Configuration/PublicTestIdentity.xcconfig
      Release: Configuration/PublicTestIdentity.xcconfig
    settings:
      base:
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_INTEGRATION_TEST_BUNDLE_IDENTIFIER)
        PRODUCT_NAME: $(TARGET_NAME)

schemes:
  Intreccio:
    build:
      targets:
        Intreccio: all
        IntreccioTests: [test]
        IntreccioIntegrationTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - IntreccioTests
        - IntreccioIntegrationTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
